<section id="users-pane" class="tab-pane fade" aria-labelledby="users-tab">
  <div class="card"><div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
      <div><h2 class="h5 mb-1">Usuarios</h2><p class="small text-medium-emphasis mb-0">Perfiles, acceso y estado de las cuentas.</p></div>
      <button id="users-logout" class="btn btn-outline-light" hidden>Cerrar sesión</button>
    </div>
    <p id="users-message" role="status" aria-live="polite"></p>
    <form id="users-login" class="row g-3">
      <div class="col-md-5"><label for="operator-name" class="form-label">Usuario administrador</label><input id="operator-name" class="form-control" autocomplete="username" required></div>
      <div class="col-md-5"><label for="operator-password" class="form-label">Contraseña</label><input id="operator-password" class="form-control" type="password" autocomplete="current-password" required></div>
      <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary" type="submit">Entrar</button></div>
    </form>
    <div id="users-workspace">
      <form id="user-form" class="user-editor mt-4" hidden>
        <h3 id="user-form-title" class="h6">Crear usuario</h3>
        <div class="row g-3">
          <div class="col-md-6"><label for="user-username" class="form-label">Usuario</label><input id="user-username" class="form-control" maxlength="32" required></div>
          <div class="col-md-6"><label for="user-display-name" class="form-label">Nombre visible</label><input id="user-display-name" class="form-control" maxlength="80" required></div>
          <div class="col-md-6"><label for="user-email" class="form-label">Email</label><input id="user-email" class="form-control" type="email" maxlength="320"></div>
          <div class="col-md-6"><label for="user-country" class="form-label">País</label><input id="user-country" class="form-control" maxlength="64"></div>
          <div class="col-md-6"><label for="user-password" class="form-label">Contraseña nueva (opcional)</label><input id="user-password" class="form-control" type="password" minlength="8" maxlength="256" autocomplete="new-password" aria-describedby="user-password-help"><small id="user-password-help" class="text-medium-emphasis">Al editar, déjala vacía para mantener la actual.</small></div>
          <div class="col-md-6 d-flex align-items-center"><label class="form-check-label"><input id="user-active" class="form-check-input me-2" type="checkbox" checked>Cuenta activa</label></div>
        </div>
        <div class="d-flex gap-2 mt-3"><button id="user-save" class="btn btn-primary" type="submit">Crear usuario</button><button id="user-cancel" class="btn btn-outline-light" type="button">Cancelar</button></div>
      </form>
      <div class="users-toolbar mt-4 mb-3">
        <div class="users-search"><label for="users-search" class="form-label">Buscar usuarios</label><input id="users-search" class="form-control" type="search" placeholder="ID, usuario, nombre, email o país"></div>
        <div><label for="users-filter" class="form-label">Estado</label><select id="users-filter" class="form-select"><option value="all">Todos</option><option value="active">Activos</option><option value="inactive">Inactivos</option></select></div>
        <button id="users-refresh" class="btn btn-outline-light" type="button">Actualizar</button>
        <button id="user-new" class="btn btn-primary" type="button"><i class="bi bi-person-plus me-2" aria-hidden="true"></i>Nuevo usuario</button>
      </div>
      <div class="table-responsive users-list"><table class="table align-middle"><caption class="visually-hidden">Lista de usuarios y controles de administración</caption><thead><tr><th scope="col">ID</th><th scope="col">Usuario</th><th scope="col">Nombre</th><th scope="col">Email</th><th scope="col">País</th><th scope="col">Estado</th><th scope="col">Creado (UTC)</th><th scope="col">Acciones</th></tr></thead><tbody id="users-rows"></tbody></table></div>
      <p id="users-count" class="small text-medium-emphasis" aria-live="polite"></p>
    </div>
  </div></div>
</section>
