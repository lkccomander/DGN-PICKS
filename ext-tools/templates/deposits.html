<section id="deposits-pane" class="tab-pane fade" aria-labelledby="deposits-tab">
  <div class="card"><div class="card-body p-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3"><div><h2 class="h5 mb-1">Depósitos</h2><p class="small text-medium-emphasis mb-0">Historial completo y revisión de solicitudes. Límite mensual por usuario: USD 1,000.00.</p></div><div class="d-flex gap-2"><label class="visually-hidden" for="deposits-filter">Filtrar depósitos</label><select id="deposits-filter" class="form-select form-select-sm" aria-label="Filtrar depósitos"><option value="all">Todos</option><option value="pending">Pendientes</option><option value="approved">Aprobados</option><option value="rejected">Rechazados</option></select><button id="deposits-refresh" class="btn btn-outline-light" type="button">Actualizar</button></div></div>
    <p id="deposits-message" role="status" aria-live="polite"></p>
    <div id="deposits-summary" class="row g-3 mb-4" aria-label="Resumen histórico de depósitos"></div>
    <div class="table-responsive users-list"><table class="table align-middle"><thead><tr><th>ID</th><th>Usuario</th><th>Monto</th><th>Solicitado (UTC)</th><th>Estado</th><th>Revisado (UTC)</th><th>Detalles / acciones</th></tr></thead><tbody id="deposits-rows"></tbody></table></div>
    <p id="deposits-count" class="small text-medium-emphasis" aria-live="polite"></p>
  </div></div>
</section>
