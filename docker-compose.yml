services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dgn_picks}
      POSTGRES_USER: ${POSTGRES_USER:-dgn_picks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgn_picks_local}
    ports:
      - "5432:5432"
    volumes:
      - dgn-picks-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dgn-picks-postgres:

