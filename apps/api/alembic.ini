[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# Keep the local fallback free of credentials. For Railway or another remote
# database, set DATABASE_URL in the shell; migrations/env.py overrides this.
#sqlalchemy.url = postgresql+psycopg://dgn_picks:dgn_picks_local@localhost:5432/dgn_picks
sqlalchemy.url = postgresql://postgres:HDhKtWeVtveMwcoKXqPoNSXDonNbBgcJ@turntable.proxy.rlwy.net:28314/railway

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
